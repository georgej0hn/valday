<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guys Click here</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 1. Night Blue Background */
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            position: relative;
            transition: background 1.5s ease;
        }

        #initial-page, #message-page {
            transition: all 0.5s ease-in-out;
            position: relative;
            z-index: 10;
        }

        .hidden { display: none; }

        /* 2. Golden Yellow Button Style */
        .btn {
            background-color: #FFD700;
            color: #000428;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transition: transform 0.3s;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 400px;
            animation: slideUp 1s ease-out;
            margin: 20px;
            border: 2px solid #00d2ff;
            color: yellow;
        }

        .main-card-img {
            width: 150px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px #00d2ff);
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
             0%, 100% { transform: translateY(0) rotate(0deg); }
             50% { transform: translateY(-15px) rotate(5deg); }
        }

        h1 { color: #FF69B4; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,210,255,0.5); }
        p { font-size: 18px; line-height: 1.6; }

        /* 3. Floating Robotics Icons Style */
        .background-decorations {
            position: absolute;
            top: 0;
            left: 0; 
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floater {
            position: absolute;
            opacity: 0.4;
            animation: moveAround 8s infinite linear;
            filter: invert(1); /* Makes dark icons white/visible on dark bg */
        }

        @keyframes moveAround {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(20px, 50px) rotate(90deg); }
            50% { transform: translate(-20px, 100px) rotate(180deg); }
            75% { transform: translate(40px, 50px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Positions for floating robotics icons */
        .floater:nth-child(1) { top: 10%; left: 10%; width: 60px; }
        .floater:nth-child(2) { top: 70%; left: 20%; width: 80px; }
        .floater:nth-child(3) { top: 30%; right: 15%; width: 70px; }
        .floater:nth-child(4) { bottom: 10%; right: 10%; width: 50px; }
        .floater:nth-child(5) { top: 50%; left: 50%; width: 40px; }
    </style>
</head>
<body>

    <div class="background-decorations">
        <img src="https://cdn-icons-png.flaticon.com/512/2001/2001426.png" class="floater" alt="robot">
        <img src="https://cdn-icons-png.flaticon.com/512/2920/2920361.png" class="floater" alt="chip">
        <img src="https://cdn-icons-png.flaticon.com/512/3067/3067451.png" class="floater" alt="gear">
        <img src="https://cdn-icons-png.flaticon.com/512/681/681611.png" class="floater" alt="circuit">
        <img src="https://cdn-icons-png.flaticon.com/512/3050/3050306.png" class="floater" alt="bolt">
    </div>

    <audio id="bgMusic" loop>
        <source src="Blue.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div id="initial-page">
        <h2 style="color: #00d2ff; text-shadow: 0 0 15px rgba(0,210,255,0.8);">Gift For You💕</h2>
        <button class="btn" onclick="showMessage()">Guyz Click Here For Serprize🎁</button>
    </div>

    <div id="message-page" class="hidden">
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712139.png" alt="Cute Robot" class="main-card-img">
            <h1>Heppy Valentine's day🥰 <br>My Dear Crazee Guyzz</h1>
            <p></p>
            <p style="font-size: 40px;">Love You Guyz😘</p>
        </div>
    </div>

    <script>
        function showMessage() {
            // Play music
            const music = document.getElementById('bgMusic');
            music.play().catch(error => console.log("Music play failed - need user gesture"));

            document.getElementById('initial-page').classList.add('hidden');
            document.getElementById('message-page').classList.remove('hidden');
            
            // 4. Change background to Light Blue theme according to the music
            document.body.style.background = "linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)";
            
            // Update floating icons opacity for light theme
            const floaters = document.querySelectorAll('.floater');
            floaters.forEach(f => {
                f.style.filter = "none";
                f.style.opacity = "0.3";
            });
        }
    </script>
</body>
</html>
